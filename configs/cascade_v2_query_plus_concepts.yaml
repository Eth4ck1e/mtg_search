# v2 prompt; embed the USER'S WORDS followed by the rewriter's concepts.
# Concepts add community vocabulary; the user's phrasing keeps its specificity
# ("destroy all creatures, sweeper" rather than "sweeper, board wipe").
name: "cascade_v2_query_plus_concepts"
description: >
  hyde_v2 filters (keywords on) + embed "<user query>, <concepts not already in it>".
eval_set: "data/eval/queries_v1_draft.yaml"
retrieval:
  type: cascade
  stage1: query_plus_concepts
  prompt: prompts/hyde_v2.yaml
  sql: true
  keywords_filter: true
  k: 10
  set_metrics: true
