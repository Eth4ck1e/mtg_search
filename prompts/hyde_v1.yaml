# HyDE prompt v1 — first draft for M4 kickoff.
#
# STATUS: system prompt drafted (schema, rules, valid values). The 6 few-shot
# example slots below are marked TODO — Mitchell writes those in his voice.
# They are the load-bearing artifact of this file — quality directly determines
# HyDE output quality.
#
# See prompts/hyde_v1_outline.md for background, iteration guidance, and
# reasoning about few-shot design.
#
