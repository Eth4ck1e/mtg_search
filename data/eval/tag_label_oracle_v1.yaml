# Tag-label oracle — v1 (2026-09-19)
#
# For each eval query: the Scryfall oracle tag(s) a *perfect* v2 rewriter would
# emit as the query's functional concept. The evaluation harness embeds the
# tag LABEL text in place of the user's query (filters still come from the
# v1 rewriter), so this measures the ceiling of "v2 prompt x tuned embedder"
# before any prompt engineering.
#
# Selection rule: the most specific tag whose closure pool covers >= ~90% of
# the query's relevant set (see scripts output logged in the 2026-09-18
# journal §5d). Queries with no functional tag (canonical keywords, pure
# structure, "ETB" which Tagger does not tag generically) get `tags: []` and
# fall through to the raw query, so they score exactly as pass-through.
#
# DRAFTED by Claude from the coverage table; Mitchell reviews the mapping.
# Coverage = |relevant ∩ closure pool| / |relevant| at draft time.

version: v1
